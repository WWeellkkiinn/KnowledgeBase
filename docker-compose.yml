name: kb

# 日志驱动统一限制（避免 json-file 撑满磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── SaaS stack (Django 5 + Postgres + Redis + Celery) ────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@db:5432/${POSTGRES_DB:-kb}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    expose:
      - "8000"
    mem_limit: 600m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@db:5432/${POSTGRES_DB:-kb}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    mem_limit: 400m
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    depends_on:
      django:
        condition: service_healthy
    # 宿主 80 已被其他服务占用，改用 8080；如宿主 80 空闲可改回 "80:80"
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
