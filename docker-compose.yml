name: kb

# 日志驱动统一限制（避免 json-file 撑满磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # .env 故意放在 ./data/ 之外：data/ 整个挂进容器 /app/data，
    # 任何遍历 papers 父目录的代码都会读到明文 token。放仓库根目录由 compose 注入环境变量即可。
    env_file:
      - ./.env
    environment:
      KB_DB_PATH: /app/data/kb.db
      PAPERS_DIR: /app/data/papers
      KB_BIND_HOST: 0.0.0.0
    # 把整个 data/ 目录挂进来：SQLite 的 wal/shm 由它自己在容器内创建/checkpoint，
    # 不会因为单文件 bind-mount 的 inode 漂移导致写丢失。
    volumes:
      - ./data:/app/data
      # 代码目录直接挂宿主机文件，git pull + restart 即可生效，无需重建镜像
      # 注意：frontend/dist 仍在镜像内，前端 JS 变更还需 --build
      - ./app:/app/app
      - ./services:/app/services
      - ./database:/app/database
      - ./templates:/app/templates
    # 让容器内能解析宿主：app -> http://host.docker.internal:13813 = ECS 本机 frps 转出的 Ollama。
    # Linux Docker 23+ 通过 host-gateway 把这个名字指到宿主的 docker0 / iptables 转发回环。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    mem_limit: 900m
    mem_reservation: 400m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    # 宿主 80 已被其他服务占用，改用 8080；如宿主 80 空闲可改回 "80:80"
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  frps:
    build:
      context: ./deploy
      dockerfile: frps.Dockerfile
    image: kb-frps:0.68.1
    # host 网络模式：同一进程同时听 7000（公网控制面）+ 13813（回环数据面）。
    # 配合 frps.toml 的 proxyBindAddr=127.0.0.1，13813 只对本机暴露，公网安全。
    # app 容器通过 extra_hosts 的 host.docker.internal 走宿主回环到达这里。
    network_mode: host
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
