name: kb

# 日志驱动统一限制（避免 json-file 撑满磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # .env 故意放在 ./data/ 之外：data/ 整个挂进容器 /app/data，
    # 任何遍历 papers 父目录的代码都会读到明文 token。放仓库根目录由 compose 注入环境变量即可。
    env_file:
      - ./.env
    environment:
      KB_DB_PATH: /app/data/kb.db
      PAPERS_DIR: /app/data/papers
      KB_BIND_HOST: 0.0.0.0
    # 把整个 data/ 目录挂进来：SQLite 的 wal/shm 由它自己在容器内创建/checkpoint，
    # 不会因为单文件 bind-mount 的 inode 漂移导致写丢失。
    volumes:
      - ./data:/app/data
      # 代码目录直接挂宿主机文件，git pull + restart 即可生效，无需重建镜像
      # 注意：frontend/dist 仍在镜像内，前端 JS 变更还需 --build
      - ./app:/app/app
      - ./services:/app/services
      - ./database:/app/database
      - ./templates:/app/templates
    expose:
      - "5000"
    mem_limit: 900m
    mem_reservation: 400m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # ── SaaS rewrite stack (Phase 0+); coexists with Flask `app` until cutover ─
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@db:5432/${POSTGRES_DB:-kb}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    expose:
      - "8000"
    mem_limit: 600m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@db:5432/${POSTGRES_DB:-kb}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    mem_limit: 400m
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    # 宿主 80 已被其他服务占用，改用 8080；如宿主 80 空闲可改回 "80:80"
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
