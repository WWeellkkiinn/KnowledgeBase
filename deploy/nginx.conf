# KnowledgeBase 反向代理（HTTP only，IP 直访）
# nginx 容器：前端静态直出 + /api/* /admin/* 反代到 django:8000
#
# SaaS rewrite: Flask `app` 已下线，所有动态流量走 Django + ninja。
# 实时进度从 Socket.IO 改为 SSE（/api/progress/stream），同样需要关 buffering。

upstream kb_app {
    server django:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # 与 KB_MINERU_ZIP_MAX_BYTES=209715200 (200MB) 对齐，留 10% buffer 防止
    # 大 PDF 上传 / MinerU zip 回调被 nginx 直接 413 截断。
    client_max_body_size 220m;

    # gzip：仅文本，二进制不压
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        text/css
        text/html
        text/plain
        text/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # hashed 资源：一年 immutable 缓存（vite 输出 *-[hash].js / *-[hash].css）
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE 进度流：关闭 buffering，长超时
    location /api/progress/stream {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 动态路由：API + Django Admin + Django 自身静态文件
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback：其余路径走 index.html 让 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
