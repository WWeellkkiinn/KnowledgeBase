# KnowledgeBase 反向代理（HTTP only，IP 直访）
# nginx 容器：前端静态直出 + /api/* /admin/* 反代到 django:8000
#
# SaaS rewrite: Flask `app` 已下线，所有动态流量走 Django + ninja。
# 实时进度从 Socket.IO 改为 SSE（/api/progress/stream），需关 buffering。
#
# ⚠ HTTP 明文部署已知约束：session cookie 无 Secure flag，存在 MITM 风险。
#   上线 HTTPS 时：
#     1. 在此加 ssl_certificate / ssl_certificate_key
#     2. 设 DJANGO_COOKIE_SECURE=true（env）
#     3. 取消下方 HSTS 注释

server_tokens off;

upstream kb_app {
    server django:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # 与 KB_MINERU_ZIP_MAX_BYTES=209715200 (200MB) 对齐
    client_max_body_size 220m;

    # gzip：仅文本，二进制不压
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/wasm
        text/css
        text/html
        text/plain
        text/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 全局安全头——⚠ nginx add_header 不跨 location 继承：
    # 凡是写了 add_header 的 location 块都必须重复声明这里的头。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 上 HTTPS 后取消注释

    # hashed 资源：一年 immutable 缓存（vite 输出 *-[hash].js / *-[hash].css）
    location /assets/ {
        access_log off;
        expires 1y;
        # 重复全局安全头（add_header 不继承）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE 进度流：^~ 提升优先级，确保不被下方正则 location 抢占
    location ^~ /api/progress/stream {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 动态路由：API / Admin / Django 静态文件
    location ^~ /api/ {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /admin/ {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /static/ {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback：其余路径走 index.html 让 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
        # 重复全局安全头（add_header 不继承）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }
}
