# frps（ECS 公网侧）配置
# 生成随机 token（≥32 字节）：
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
# 把下方 auth.token 同步到客户端 frpc.toml；不一致会拒连。

bindPort = 7000

# 把所有 type=tcp 反向代理的 remotePort 只绑回环，公网不可见。
# 这样隧道端口只能从本机访问（app 容器走 host.docker.internal），
# 即使 frps 暴露在公网，外网 nmap 也看不到上游服务。
proxyBindAddr = "127.0.0.1"

# 白名单 frpc 可申请映射的端口段，防止已认证客户端任意暴露端口。
# Ollama 默认 11434；按你 frpc.toml 的 remotePort 调整。
allowPorts = [
    { start = 11434, end = 11434 },
    { start = 13813, end = 13813 },
]

[auth]
method = "token"
token = "REPLACE_WITH_RANDOM_TOKEN"

[transport.tls]
# 已知问题（2026-05）：snowdreamtech/frps:0.68.1 与官方 fatedier/frp 0.68.1 frpc
# 的 TLS 握手不兼容（症状：frpc 报 "session shutdown"，frps 完全收不到连接）。
# 临时关 TLS；token (43 字符 base64) + ufw 限制 7000 来源仍提供足够鉴权。
# 长期修复：换 fatedier 官方镜像或 ECS 上跑原生 binary 后取消下行注释。
# force = true

[log]
to = "console"
level = "info"
maxDays = 3

# 不开 webServer（dashboard）；公网少一个攻击面。
# [webServer]
# addr = "127.0.0.1"
# port = 7500
